<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="no"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Life Planner"/>
<link rel="apple-touch-icon" href="icon.png"/>
<meta name="theme-color" content="#D9D2C6"/>
<title>Life Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mocha:#6B5B4E;--walnut:#9E8B7D;--stone:#C4B5A8;--greige:#D9D2C6;--ivory:#F5F2EC;
  --ink:#5C4F45;--muted:#9E8B7D;--cream:#F5F2EC;--white:#FDFCFA;--header:#D9D2C6;
}
html,body{height:100%;background:var(--ivory);color:var(--ink);font-family:"Jost",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#header{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--greige);color:var(--mocha);padding:env(safe-area-inset-top,0px) 18px 0;box-shadow:0 2px 16px rgba(180,165,150,.3)}
#header-top{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 0 10px}
.app-sub{font-size:9px;letter-spacing:4px;opacity:.55;text-transform:uppercase;margin-bottom:3px;font-weight:400;color:var(--walnut)}
.app-title{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;letter-spacing:.5px;font-style:italic;color:var(--mocha)}
#week-nav{text-align:right}
#week-label{font-size:10px;opacity:.6;margin-bottom:7px;letter-spacing:.5px;color:var(--walnut)}
#nav-btns{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.nav-btn{background:rgba(255,255,255,.5);border:1px solid rgba(180,165,150,.4);color:var(--mocha);border-radius:20px;padding:4px 12px;font-size:10px;cursor:pointer;font-family:"Jost",sans-serif;letter-spacing:.5px}
.setup-btn{background:rgba(255,255,255,.6);border:1px solid rgba(180,165,150,.5);color:var(--mocha);border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:"Jost",sans-serif;font-weight:500}
#view-tabs{display:flex;gap:4px;margin-bottom:10px}
.vtab{flex:1;padding:7px 0;border-radius:20px;border:none;cursor:pointer;font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;font-family:"Jost",sans-serif;background:rgba(255,255,255,.35);color:var(--walnut);transition:all .2s}
.vtab.active{background:var(--ivory);color:var(--mocha);box-shadow:0 1px 6px rgba(180,165,150,.3)}
#day-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
#day-tabs::-webkit-scrollbar{display:none}
.dtab{min-width:50px;flex-shrink:0;padding:6px 3px;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.25);color:rgba(92,79,69,.45);cursor:pointer;text-align:center;font-family:"Jost",sans-serif}
.dtab.today{background:rgba(255,255,255,.5);color:var(--mocha)}
.dtab.active{border-color:var(--walnut);background:rgba(255,255,255,.7);color:var(--mocha)}
.dtab-name{font-size:9px;letter-spacing:1.5px;font-weight:500;margin-bottom:2px;text-transform:uppercase}
.dtab-today{font-size:7px;opacity:.65;margin-bottom:2px;letter-spacing:1px}
.ring{width:28px;height:28px;border-radius:50%;margin:2px auto 0;display:flex;align-items:center;justify-content:center}
.ring-in{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:600;color:var(--mocha)}
#main{padding-bottom:80px}
.sec-card{margin:0 14px 10px;border-radius:14px;overflow:hidden;border:1px solid var(--lt,#E8E2DA);background:var(--white)}
.sec-card.open{border-color:var(--ac,#C4B5A8);border-width:1.5px}
.sec-hdr{width:100%;padding:14px 16px;background:var(--white);border:none;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;font-family:"Jost",sans-serif}
.sec-card.open .sec-hdr{background:var(--bg,#FAF8F5)}
.sec-icon{font-size:18px}
.sec-name{font-size:10px;font-weight:600;letter-spacing:2.5px;color:var(--ac);text-transform:uppercase}
.sec-badge{font-size:11px;font-weight:600;color:var(--ac);margin-right:4px;opacity:.8}
.sec-badge.dim{color:var(--stone)}
.chev{font-size:16px;opacity:.3;transition:transform .2s;margin-left:auto;color:var(--walnut)}
.sec-card.open .chev{transform:rotate(90deg)}
.sec-body{display:none;padding:6px 16px 16px;background:var(--bg,#FAF8F5)}
.sec-card.open .sec-body{display:block}
.crow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cbtn{width:24px;height:24px;border-radius:50%;flex-shrink:0;border:1.5px solid #D9D2C6;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--white);font-family:"Jost",sans-serif}
.cbtn.hv{border-color:var(--ac)}
.cbtn.chk{background:var(--ac);border-color:var(--ac)}
.clabel{flex:1;font-size:14px;min-height:20px;color:var(--ink);font-weight:300;letter-spacing:.2px}
.clabel.done{text-decoration:line-through;color:var(--stone)}
.clabel.empty{color:var(--stone);font-style:italic;cursor:text}
.wi-inp{flex:1;border:none;border-bottom:1.5px solid var(--ac,#C4B5A8);background:transparent;font-size:14px;padding:2px 0;outline:none;color:var(--ink);font-family:"Jost",sans-serif;font-weight:300}
.hab-lbl{font-size:9px;letter-spacing:2.5px;font-weight:600;color:var(--ac);margin:10px 0 8px;text-transform:uppercase}
.more-btn{width:100%;margin-top:4px;padding:9px;border-radius:8px;border:1.5px dashed var(--stone);background:transparent;color:var(--walnut);font-size:11px;font-weight:500;letter-spacing:1px;cursor:pointer;font-family:"Jost",sans-serif;text-transform:uppercase}
.wv,.dv{padding:14px 14px 80px}
.sec-ttl{font-size:9px;letter-spacing:3px;text-transform:uppercase;opacity:.4;margin-bottom:10px;margin-top:18px;font-weight:500}
.sec-ttl:first-child{margin-top:0}
.dcard{width:100%;margin-bottom:10px;padding:14px 16px;border-radius:14px;border:1px solid #EDE8E2;background:var(--white);cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;font-family:"Jost",sans-serif;box-shadow:0 1px 6px rgba(180,165,150,.1)}
.dcard.tod{background:var(--greige);border-color:var(--stone);box-shadow:0 4px 16px rgba(180,165,150,.3)}
.dcard-name{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:.3px}
.dcard.tod .dcard-name{color:var(--mocha)}
.tod-pill{font-size:8px;background:var(--walnut);color:var(--ivory);border-radius:20px;padding:2px 8px;letter-spacing:1.5px;font-weight:500;text-transform:uppercase}
.pbar-w{height:3px;background:var(--greige);border-radius:2px;margin-top:8px;overflow:hidden;opacity:.6}
.dcard.tod .pbar-w{background:rgba(255,255,255,.4);opacity:1}
.pbar{height:100%;border-radius:2px;background:var(--walnut)}
.dcard.tod .pbar{background:var(--walnut)}
.dpct{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600;color:var(--ink)}
.dcard.tod .dpct{color:var(--mocha)}
.dfrac{font-size:10px;opacity:.4;letter-spacing:.3px}
.garr{font-size:16px;opacity:.2;color:var(--walnut)}
.ccat{margin-bottom:10px;padding:13px 15px;border-radius:12px;background:var(--white);border:1px solid #EDE8E2}
.ccat-top{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center}
.ccat-lbl{font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase}
.ccat-pct{font-family:"Cormorant Garamond",serif;font-size:18px;font-weight:600}
.cbar-w{height:3px;background:var(--greige);border-radius:2px;overflow:hidden;opacity:.5}
.cbar{height:100%;border-radius:2px}
.cfrac{font-size:10px;opacity:.38;margin-top:6px;letter-spacing:.3px}
.exp-btn{background:var(--walnut);color:var(--ivory);border:none;border-radius:20px;padding:8px 16px;font-size:10px;cursor:pointer;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;font-family:"Jost",sans-serif;white-space:nowrap}
.exp-gold{width:100%;background:var(--walnut);color:var(--ivory);border:none;border-radius:10px;padding:13px;font-size:11px;cursor:pointer;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;font-family:"Jost",sans-serif;margin-bottom:18px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mnav-btn{background:var(--white);color:var(--walnut);border:1px solid #EDE8E2;border-radius:20px;padding:7px 16px;font-size:16px;cursor:pointer;font-family:"Jost",sans-serif}
.m-title{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;text-align:center;letter-spacing:.5px;font-style:italic;color:var(--mocha)}
.m-sub{font-size:10px;opacity:.38;text-align:center;margin-top:2px;letter-spacing:.5px}
.ov-card{background:var(--greige);border-radius:16px;padding:24px;margin-bottom:14px;text-align:center}
.ov-lbl{font-size:9px;letter-spacing:3px;color:var(--walnut);margin-bottom:8px;text-transform:uppercase}
.ov-pct{font-family:"Cormorant Garamond",serif;font-size:64px;font-weight:600;color:var(--mocha);line-height:1;font-style:italic}
.ov-frac{font-size:11px;color:var(--walnut);margin-top:6px;letter-spacing:.5px;opacity:.7}
.empty{text-align:center;padding:60px 20px;opacity:.35}
.wsc{margin-bottom:10px;padding:13px 15px;border-radius:12px;background:var(--white);border:1px solid #EDE8E2}
.wsc-top{display:flex;justify-content:space-between;margin-bottom:6px}
.wsc-lbl{font-size:13px;font-weight:400;font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--ink)}
.wsc-pct{font-family:"Cormorant Garamond",serif;font-size:16px;font-weight:600;color:var(--walnut)}
.wsc-frac{font-size:10px;opacity:.38;margin-top:4px;letter-spacing:.3px}
.dv-top{display:flex;justify-content:space-between;align-items:flex-end;padding:14px}
.dv-title{font-family:"Cormorant Garamond",serif;font-size:36px;font-weight:600;letter-spacing:.5px;font-style:italic;color:var(--mocha)}
.rf{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
/* Setup */
.sv{padding:14px 14px 100px}
.s-hero{background:var(--greige);border-radius:16px;padding:22px;margin-bottom:20px;text-align:center}
.s-hero-t{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;color:var(--mocha);margin-bottom:6px;font-style:italic}
.s-hero-s{font-size:12px;color:var(--walnut);line-height:1.6;letter-spacing:.3px}
.s-cat{background:var(--white);border-radius:14px;border:1px solid #EDE8E2;margin-bottom:12px;overflow:hidden}
.s-cat-hdr{display:flex;align-items:center;gap:10px;padding:14px 15px}
.s-cat-name{font-size:12px;font-weight:500;letter-spacing:2px;text-transform:uppercase;flex:1}
.s-cat-freq{font-size:10px;opacity:.4;margin-top:2px;letter-spacing:.3px}
.s-cat-btns{display:flex;gap:6px}
.ibtn{background:none;border:none;cursor:pointer;font-size:16px;padding:4px;border-radius:6px;font-family:inherit;opacity:.6}
.s-tasks{padding:0 15px 14px;border-top:1px solid #F0EDE8}
.s-task{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #F8F5F2}
.s-task:last-child{border-bottom:none}
.s-task-name{flex:1;font-size:13px;font-weight:300}
.s-task-freq{font-size:10px;opacity:.4;letter-spacing:.3px}
.add-cat-btn{width:100%;padding:14px;border-radius:14px;border:1.5px dashed var(--stone);background:transparent;color:var(--stone);font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:"Jost",sans-serif}
.done-btn{width:100%;padding:16px;border-radius:14px;border:none;background:var(--walnut);color:var(--ivory);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:"Jost",sans-serif}
/* Modal */
.mo{position:fixed;inset:0;background:rgba(180,165,150,.45);z-index:500;display:flex;align-items:flex-end;justify-content:center}
.mo.hidden{display:none}
.mo-box{background:var(--ivory);border-radius:24px 24px 0 0;padding:26px 20px 44px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto}
.mo-title{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;margin-bottom:20px;font-style:italic;color:var(--mocha)}
.mo-lbl{font-size:9px;letter-spacing:2.5px;font-weight:500;opacity:.5;text-transform:uppercase;margin-bottom:8px;margin-top:18px;color:var(--mocha)}
.mo-inp{width:100%;border:1.5px solid var(--greige);border-radius:10px;padding:11px 13px;font-size:14px;font-family:"Jost",sans-serif;outline:none;background:var(--white);color:var(--ink);font-weight:300}
.mo-inp:focus{border-color:var(--walnut)}
.mo-inp.sm{font-size:13px;padding:8px 11px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:4px}
.fbtn{padding:10px 6px;border-radius:10px;border:1.5px solid var(--greige);background:var(--white);font-size:11px;font-weight:500;letter-spacing:.5px;cursor:pointer;font-family:"Jost",sans-serif;text-align:center;color:var(--walnut)}
.fbtn.active{border-color:var(--walnut);background:var(--greige);color:var(--mocha)}
.dgrid{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dchip{padding:6px 12px;border-radius:20px;border:1.5px solid var(--greige);background:var(--white);font-size:11px;font-weight:500;cursor:pointer;font-family:"Jost",sans-serif;color:var(--walnut);letter-spacing:.5px}
.dchip.active{border-color:var(--walnut);background:var(--greige);color:var(--mocha)}
.cgrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.csw{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.csw.active{border-color:var(--mocha);transform:scale(1.15)}
.igrid{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ichip{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--greige);background:var(--white);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ichip.active{border-color:var(--walnut);background:rgba(217,210,198,.3)}
.mo-save{width:100%;padding:14px;border-radius:12px;border:none;background:var(--walnut);color:var(--ivory);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:"Jost",sans-serif;margin-top:22px}
.mo-cancel{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--greige);background:transparent;color:var(--stone);font-size:11px;font-weight:500;letter-spacing:1px;cursor:pointer;font-family:"Jost",sans-serif;margin-top:8px;text-transform:uppercase}
.mo-del{width:100%;padding:12px;border-radius:12px;border:none;background:#fdf0ee;color:#b85c52;font-size:11px;font-weight:500;letter-spacing:1px;cursor:pointer;font-family:"Jost",sans-serif;margin-top:8px;text-transform:uppercase}
.mo-out{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--greige);background:var(--white);color:var(--mocha);font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:"Jost",sans-serif;margin-top:8px}
.qs-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--greige);background:var(--white);cursor:pointer;text-align:left;width:100%;font-family:"Jost",sans-serif;margin-bottom:8px}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
/* Priority picker */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.pbtn{padding:12px 8px;border-radius:12px;border:1.5px solid var(--greige);background:var(--white);font-size:11px;font-weight:500;cursor:pointer;font-family:"Jost",sans-serif;text-align:center;color:var(--walnut);line-height:1.4}
.pbtn.active{border-color:var(--walnut);background:var(--greige);color:var(--mocha)}
/* Priorities view */
.pv{padding:14px 14px 80px}
.pv-tier{margin-bottom:24px}
.pv-tier-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 2px}
.pv-tier-num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.pv-tier-name{font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase}
.pv-tier-count{font-size:10px;opacity:.4;margin-left:auto;letter-spacing:.3px}
.pv-task{margin-bottom:8px;padding:12px 14px;border-radius:12px;background:var(--white);border:1px solid #EDE8E2;display:flex;align-items:center;gap:10px}
.pv-task-meta{font-size:10px;opacity:.4;margin-top:2px;letter-spacing:.3px}
.pv-empty{font-size:13px;opacity:.35;font-style:italic;padding:8px 2px}
@media(min-width:500px){#header,#main{max-width:480px;margin:0 auto;left:0;right:0}#header{left:50%;transform:translateX(-50%);width:480px}.mo-box{max-width:480px}}
</style>
</head>
<body>
<div id="header">
  <div id="header-top">
    <div><div class="app-sub">Weekly</div><div class="app-title">Life Planner</div></div>
    <div id="week-nav"><div id="week-label"></div><div id="nav-btns"></div></div>
  </div>
  <div id="view-tabs"></div>
  <div id="day-tabs"></div>
</div>
<style>
#pin-screen{position:fixed;inset:0;background:var(--ivory);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;font-family:"Jost",sans-serif}
.pin-title{font-family:"Cormorant Garamond",serif;font-size:32px;font-weight:600;font-style:italic;color:var(--mocha);margin-bottom:6px}
.pin-sub{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);margin-bottom:40px}
.pin-input-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:260px}
#pin-input{width:100%;text-align:center;font-size:28px;letter-spacing:12px;border:none;border-bottom:2px solid var(--greige);background:transparent;outline:none;color:var(--mocha);font-family:"Jost",sans-serif;padding:8px 0;-webkit-text-security:disc}
#pin-error{font-size:12px;color:#c0392b;min-height:16px;letter-spacing:.5px}
#pin-submit{width:100%;padding:14px;border-radius:14px;border:none;background:var(--walnut);color:var(--ivory);font-size:11px;font-weight:500;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:"Jost",sans-serif}
.pin-flower{font-size:44px;margin-bottom:16px}
</style>

<div id="pin-screen">
  <div class="pin-flower">🌸</div>
  <div class="pin-title">Life Planner</div>
  <div class="pin-sub">Enter your PIN to continue</div>
  <div class="pin-input-wrap">
    <input id="pin-input" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autocomplete="off"/>
    <div id="pin-error"></div>
    <button id="pin-submit">Unlock</button>
  </div>
</div>
<input type="file" id="import-file-input" accept=".json" style="display:none"/>
<div id="main"></div>
<div class="mo hidden" id="mo"><div class="mo-box" id="mo-box"></div></div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────────
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PALETTE=[
  {ac:"#C9A8B8",bg:"#FDF0F5",lt:"#F2D8E4"},
  {ac:"#9DB5C9",bg:"#EFF5FB",lt:"#D5E5F2"},
  {ac:"#B8A9CC",bg:"#F4F0FA",lt:"#DED5EF"},
  {ac:"#A8C4B8",bg:"#EFF7F3",lt:"#D1EAE0"},
  {ac:"#C9B89A",bg:"#FAF4EC",lt:"#EDE0CC"},
  {ac:"#C4A8A8",bg:"#FBF0F0",lt:"#EDD8D8"},
  {ac:"#A8B8C9",bg:"#EFF4FB",lt:"#D1E0EF"},
  {ac:"#C9C2A8",bg:"#FAF8EF",lt:"#EDEAD0"},
  {ac:"#B8C4A8",bg:"#F2F7EE",lt:"#D8E8CC"},
  {ac:"#C4B0C9",bg:"#F8F0FB",lt:"#E8D5EF"},
];
const ICONS=["💪","🧹","🥗","📋","✅","✨","🏠","💊","📚","🎵","💰","🐱","🌿","🧘","🛒","💼","🎯","🌟","🏃","❤️"];

// ── Frequency ──────────────────────────────────────────────────────────────────
function fLabel(f){
  if(!f||f.type==="daily") return "Every day";
  if(f.type==="task-days") return "When tasks are scheduled";
  if(f.type==="days") return (f.days||[]).map(d=>DS[d]).join(", ");
  if(f.type==="weekly") return "Weekly · "+DS[f.day||0];
  if(f.type==="monthly") return "Monthly · "+ord(f.date||1);
  if(f.type==="annually") return "Annually · "+MONTHS[f.month||0]+" "+f.date;
  if(f.type==="once") return "Once · "+(f.date?MONTHS[f.month||0]+" "+f.date+", "+(f.year||new Date().getFullYear()):"pick a date");
  return "";
}

// ── Once task helper ──────────────────────────────────────────────────────────
function onceTaskMatchesDay(tk, wk, day){
  if(!tk.freq||tk.freq.type!=="once") return false;
  const f=tk.freq;
  if(!f.date||f.month===undefined||!f.year) return false;
  const taskStr=f.year+"-"+String(f.month+1).padStart(2,"0")+"-"+String(f.date).padStart(2,"0");
  const{sunday}=parseWk(wk);
  const di=DAYS.indexOf(day);
  const d=new Date(sunday.getFullYear(),sunday.getMonth(),sunday.getDate()+di);
  const dayStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return taskStr===dayStr;
}
function fApplies(f,di,slotDateStr){
  if(!f||f.type==="daily") return true;
  if(f.type==="days") return (f.days||[]).includes(di);
  if(f.type==="weekly") return di===(f.day||0);
  if(f.type==="monthly"){
    const now=new Date();
    const weekStart=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()+wkOff*7);
    weekStart.setHours(0,0,0,0);
    const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);weekEnd.setHours(23,59,59,999);
    for(let mOff=-1;mOff<=1;mOff++){
      const d=new Date(weekStart.getFullYear(),weekStart.getMonth()+mOff,f.date||1);
      if(d>=weekStart&&d<=weekEnd&&d.getDay()===di) return true;
    }
    return false;
  }
  if(f.type==="annually"){
    const now=new Date();
    const weekStart=new Date(now);weekStart.setDate(now.getDate()-now.getDay()+wkOff*7);weekStart.setHours(0,0,0,0);
    const weekEnd=new Date(weekStart);weekEnd.setDate(weekStart.getDate()+6);weekEnd.setHours(23,59,59,999);
    const target=new Date(weekStart.getFullYear(),f.month||0,f.date||1);
    return target>=weekStart&&target<=weekEnd&&target.getDay()===di;
  }
  if(f.type==="once"){
    if(!f.date||f.month===undefined||!f.year) return false;
    const taskDateStr=f.year+"-"+String(f.month+1).padStart(2,"0")+"-"+String(f.date).padStart(2,"0");
    if(slotDateStr) return taskDateStr===slotDateStr;
    // fallback if no slotDateStr passed
    const wkParts=wkKey(wkOff).split("-");
    const slotDate=new Date(parseInt(wkParts[0]),parseInt(wkParts[1])-1,parseInt(wkParts[2])+di);
    const computed=slotDate.getFullYear()+"-"+String(slotDate.getMonth()+1).padStart(2,"0")+"-"+String(slotDate.getDate()).padStart(2,"0");
    return taskDateStr===computed;
  }
  return false;
}
function catOn(cat,di,wk,day){
  if(cat.isHabits) return true;
  const freq=cat.freq||{type:"daily"};
  if(freq.type==="task-days"){
    let dStr=null;
    if(wk&&day){const{sunday}=parseWk(wk);const dd=new Date(sunday.getFullYear(),sunday.getMonth(),sunday.getDate()+DAYS.indexOf(day));dStr=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");}
    return catAllTasks(cat,dStr).some(tk=>{
      if(tk.freq&&tk.freq.type==="once") return wk&&day?onceTaskMatchesDay(tk,wk,day):false;
      return fApplies(tk.freq,di);
    });
  }
  return fApplies(freq,di);
}
function ord(n){const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

// ── Routines ───────────────────────────────────────────────────────────────────
// A routine is a named, saved bundle of tasks (with their own frequencies) that
// lives inside a category. Only one routine per category can be "active" at a
// time (cat.activeRoutineId). An active routine's tasks are combined with the
// category's loose tasks everywhere tasks are shown/counted/exported. An
// inactive routine's tasks are fully hidden and don't count toward anything,
// but stay saved untouched until the user edits or deletes them.
function getActiveRoutine(cat){
  if(!cat||!cat.routines||!cat.routines.length||!cat.activeRoutineId) return null;
  return cat.routines.find(r=>r.id===cat.activeRoutineId)||null;
}
function todayStr(){const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");}
// Record that `rid` (or null for "no routine") became active on `cat`, starting today.
// This timeline is what lets past days keep showing whichever routine was actually
// running on them, even after you've since switched to a different one.
function logRoutineChange(cat,rid){
  cat.routineLog=cat.routineLog||[];
  const t=todayStr();
  const last=cat.routineLog[cat.routineLog.length-1];
  if(last&&last.start===t) last.routineId=rid;
  else cat.routineLog.push({routineId:rid,start:t});
}
// Which routine (if any) was active on a given category on a given date.
// Uses the recorded timeline when we have one. For dates before any timeline
// existed (i.e. history from before this feature, or before the very first
// toggle), we can't know for certain which single routine was live — so rather
// than dropping that history, every routine's tasks count for those old days.
function catAllTasks(cat,dateStr){
  if(!cat) return [];
  const loose=cat.tasks||[];
  const log=cat.routineLog;
  if(dateStr&&log&&log.length){
    let rid=null;
    for(const entry of log){ if(entry.start<=dateStr) rid=entry.routineId; else break; }
    const rt=rid?(cat.routines||[]).find(r=>r.id===rid):null;
    return loose.concat(rt?(rt.tasks||[]):[]);
  }
  if(dateStr&&dateStr<todayStr()){
    let all=loose.slice();
    (cat.routines||[]).forEach(rt=>{all=all.concat(rt.tasks||[]);});
    return all;
  }
  const rt=getActiveRoutine(cat);
  return loose.concat(rt?(rt.tasks||[]):[]);
}
// Locate a task among a category's loose tasks or ANY of its routines
// (active or not) — used for edit/delete so you can still manage a task
// that's currently hidden inside an inactive routine.
function getTaskById(cat,tid){
  if(!cat) return null;
  let tk=(cat.tasks||[]).find(t=>t.id===tid);
  if(tk) return{task:tk,arr:cat.tasks,routine:null};
  for(const rt of (cat.routines||[])){
    tk=(rt.tasks||[]).find(t=>t.id===tid);
    if(tk) return{task:tk,arr:rt.tasks,routine:rt};
  }
  return null;
}
// Like getTaskById, but if a routineId is explicitly known, look there directly.
function findTaskAndArr(cat,tid,routineId){
  if(routineId){
    const rt=(cat.routines||[]).find(r=>r.id===routineId);
    if(rt){const tk=(rt.tasks||[]).find(t=>t.id===tid);if(tk) return{task:tk,arr:rt.tasks,routine:rt};}
    return null;
  }
  return getTaskById(cat,tid);
}

// ── Progress ───────────────────────────────────────────────────────────────────
function catProg(cat,day,wk){
  wk=wk||wkKey();
  const di=DAYS.indexOf(day),ch=_checks[wk]||{},c=_custom||{};
  let done=0,total=0;
  function isChk(key){return !!(ch[key]||ch[wk+":"+key]);}
  if(cat.isHabits){
    ["forMe","forUs"].forEach(t=>[0,1,2].forEach(i=>{
      const v=c[wk+":"+day+":hab_"+t+"_"+i]||"";
      if(v){total++;if(isChk(day+":"+cat.id+":hab_"+t+"_"+i))done++;}
    }));
    return{done,total};
  }
  // compute actual date string for this day slot
  const _sun=parseWk(wk).sunday;
  const _d=new Date(_sun.getFullYear(),_sun.getMonth(),_sun.getDate()+di);
  const _slotStr=_d.getFullYear()+"-"+String(_d.getMonth()+1).padStart(2,"0")+"-"+String(_d.getDate()).padStart(2,"0");
  catAllTasks(cat,_slotStr).forEach(tk=>{
    const checked=isChk(day+":"+cat.id+":"+tk.id);
    const skipped=!!(ch[day+":"+cat.id+":"+tk.id+"__skip"]);
    if(skipped&&!checked) return;
    const applies=(tk.freq&&tk.freq.type==="once"?onceTaskMatchesDay(tk,wk,day):fApplies(tk.freq,di,_slotStr))&&taskCreatedBeforeOrOnDay(tk,wk,day);
    if(tk.rollover){
      const activeDate=getActiveRolloverDate(tk,cat);
      if(activeDate){
        const wkParts=wk.split("-");
        const wkSun=new Date(parseInt(wkParts[0]),parseInt(wkParts[1])-1,parseInt(wkParts[2]));
        const thisDayDate=new Date(wkSun.getFullYear(),wkSun.getMonth(),wkSun.getDate()+di);
        const thisDayStr=thisDayDate.getFullYear()+"-"+String(thisDayDate.getMonth()+1).padStart(2,"0")+"-"+String(thisDayDate.getDate()).padStart(2,"0");
        if(thisDayStr===activeDate){total++;if(checked)done++;}
      } else if(checked){total++;done++;}
      return;
    }
    if(!applies&&!checked) return;
    total++;if(checked) done++;
  });
  return{done,total};
}
function dayProg(day,wk){
  let done=0,total=0;
  (getCats()||[]).forEach(cat=>{
    if(!catOn(cat,DAYS.indexOf(day),wk,day)) return;
    const p=catProg(cat,day,wk);done+=p.done;total+=p.total;
  });
  return{done,total};
}

// ── Day View ───────────────────────────────────────────────────────────────────
function buildDay(){
  const day=activeDay,di=DAYS.indexOf(day),cats=getCats()||[];
  const wk=wkKey(),ch=chks(),c=cu();
  const{sunday:_daySun}=parseWk(wk);
  const _dayDateObj=new Date(_daySun.getFullYear(),_daySun.getMonth(),_daySun.getDate()+di);
  const dayDateStr=_dayDateObj.getFullYear()+"-"+String(_dayDateObj.getMonth()+1).padStart(2,"0")+"-"+String(_dayDateObj.getDate()).padStart(2,"0");
  if(!cats.length) return emptyPlanner();
  let h='<div class="dv-top"><div><div class="dv-title">'+day+"</div>"+
    '<div style="font-size:11px;opacity:.45;letter-spacing:.5px;margin-top:2px;color:var(--walnut)">'+
    (()=>{const now=new Date();const di=DAYS.indexOf(day);const todayDi=now.getDay();const diff=di-todayDi+(wkOff*7);const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+diff);return (d.getMonth()+1)+"/"+d.getDate();})()
    +"</div></div>"
    +'<div style="display:flex;gap:6px">'
    
    +'<button class="exp-btn" data-action="export-week">&#x2B07; EXPORT</button>'
    +'</div></div>';

  const activeCats=cats.filter(cat=>catOn(cat,di,wk,activeDay));
  const incomplete=[],empty=[],complete=[];
  activeCats.forEach(cat=>{
    const p=catProg(cat,day,wk);
    if(p.total===0) empty.push(cat);
    else if(p.done===p.total) complete.push(cat);
    else incomplete.push(cat);
  });
  const sorted=[...incomplete,...empty,...complete];

  let completeDividerAdded=false,emptyDividerAdded=false;
  sorted.forEach(cat=>{
    const prog=catProg(cat,day,wk);
    const isComplete=prog.total>0&&prog.done===prog.total;
    const isEmpty=prog.total===0;
    if(isEmpty&&!emptyDividerAdded){
      emptyDividerAdded=true;
      h+=divider("No tasks today");
    }
    if(isComplete&&!completeDividerAdded){
      completeDividerAdded=true;
      h+=divider("Completed");
    }
    const p=PALETTE[cat.color||0],isO=openSec===cat.id;
    const cardOpacity=isComplete?'0.45':isEmpty?'0.6':'1';
    h+='<div class="sec-card'+(isO?" open":"")+'" style="--ac:'+p.ac+';--bg:'+p.bg+';--lt:'+p.lt+';opacity:'+cardOpacity+'">';
    const chkVal=(key)=>!!(ch[key]||ch[wk+":"+key]);
    if(cat.isHabits){
      let done=0,total=0;
      ["forMe","forUs"].forEach(t=>[0,1,2].forEach(i=>{
        const v=c[wk+":"+day+":hab_"+t+"_"+i]||"";
        if(v){total++;if(chkVal(day+":"+cat.id+":hab_"+t+"_"+i))done++;}
      }));
      h+=secHdr(cat,done,total,isO);
      h+='<div class="sec-body">';
      ["forMe","forUs"].forEach(t=>{
        h+='<div class="hab-lbl">'+(t==="forMe"?"FOR ME":"FOR US")+"</div>";
        [0,1,2].forEach(i=>{
          const val=c[wk+":"+day+":hab_"+t+"_"+i]||"";
          const done2=chkVal(day+":"+cat.id+":hab_"+t+"_"+i);
          h+=wiRow(cat.id,"hab_"+t+"_"+i,val,done2,p.ac,false,true,"Add "+(t==="forMe"?"personal":"shared")+" habit...");
        });
      });
      h+="</div></div>";return;
    }
    h+=secHdr(cat,prog.done,prog.total,isO);
    h+='<div class="sec-body">';
    catAllTasks(cat,dayDateStr).forEach(tk=>{
      const chk=chkVal(day+":"+cat.id+":"+tk.id);
      const skipped=!!(ch[day+":"+cat.id+":"+tk.id+"__skip"]);
      if(skipped&&!chk) return;
      const _wkSun2=parseWk(wk).sunday;
      const _dd2=new Date(_wkSun2.getFullYear(),_wkSun2.getMonth(),_wkSun2.getDate()+di);
      const _slotStr2=_dd2.getFullYear()+"-"+String(_dd2.getMonth()+1).padStart(2,"0")+"-"+String(_dd2.getDate()).padStart(2,"0");
      const applies=(tk.freq&&tk.freq.type==="once"?onceTaskMatchesDay(tk,wk,day):fApplies(tk.freq,di,_slotStr2))&&taskCreatedBeforeOrOnDay(tk,wk,day);
      if(tk.rollover){
        const activeDate=getActiveRolloverDate(tk,cat);
        const wkParts=wk.split("-");
        const wkSun=new Date(parseInt(wkParts[0]),parseInt(wkParts[1])-1,parseInt(wkParts[2]));
        const thisDayDate=new Date(wkSun.getFullYear(),wkSun.getMonth(),wkSun.getDate()+di);
        const thisDayStr=thisDayDate.getFullYear()+"-"+String(thisDayDate.getMonth()+1).padStart(2,"0")+"-"+String(thisDayDate.getDate()).padStart(2,"0");
        if(activeDate){
          if(thisDayStr===activeDate){h+=fixedRow(cat.id,tk.id,tk.name+(applies?"":" ↻"),chk,p.ac,tk.url,tk.freq&&tk.freq.type==="once");}
          else if(chk){h+=fixedRow(cat.id,tk.id,tk.name,chk,p.ac,tk.url,tk.freq&&tk.freq.type==="once");}
        } else if(chk){h+=fixedRow(cat.id,tk.id,tk.name,chk,p.ac,tk.url,tk.freq&&tk.freq.type==="once");}
        return;
      }
      if(applies){h+=fixedRow(cat.id,tk.id,tk.name,chk,p.ac,tk.url,tk.freq&&tk.freq.type==="once");return;}
      if(chk) h+=fixedRow(cat.id,tk.id,tk.name,chk,p.ac,tk.url,tk.freq&&tk.freq.type==="once");
    });
    if(catAllTasks(cat,dayDateStr).filter(tk=>{
      const chk=chkVal(day+":"+cat.id+":"+tk.id);
      return fApplies(tk.freq,di)||chk||tk.rollover;
    }).length===0){
      h+='<div style="font-size:13px;opacity:.4;padding:4px 0 8px;font-style:italic">No tasks for today.</div>';
    }
    h+='<button class="more-btn" data-action="new-task" data-cat="'+cat.id+'">+ Add Task</button>';
    h+="</div></div>";
  });
  return h;
}

// ── Priorities View ────────────────────────────────────────────────────────────
function buildPriorities(){
  const day=activeDay,di=DAYS.indexOf(day),cats=getCats()||[];
  const wk=wkKey(),ch=chks();
  const chkVal=(key)=>!!(ch[key]||ch[wk+":"+key]);
  const{sunday:_pSun}=parseWk(wk);
  const _pDate=new Date(_pSun.getFullYear(),_pSun.getMonth(),_pSun.getDate()+di);
  const dayDateStr=_pDate.getFullYear()+"-"+String(_pDate.getMonth()+1).padStart(2,"0")+"-"+String(_pDate.getDate()).padStart(2,"0");

  // Collect all tasks for today with their priority
  const buckets={1:[],2:[],3:[],4:[]};

  cats.forEach(cat=>{
    if(!catOn(cat,di)||cat.isHabits) return;
    catAllTasks(cat,dayDateStr).forEach(tk=>{
      const chk=chkVal(day+":"+cat.id+":"+tk.id);
      const skipped=!!(ch[day+":"+cat.id+":"+tk.id+"__skip"]);
      if(skipped&&!chk) return;
      const applies=(tk.freq&&tk.freq.type==="once"?onceTaskMatchesDay(tk,wk,day):fApplies(tk.freq,di))&&taskCreatedBeforeOrOnDay(tk,wk,day);

      let show=applies;
      if(tk.rollover){
        const activeDate=getActiveRolloverDate(tk,cat);
        if(activeDate){
          const wkParts=wk.split("-");
          const wkSun=new Date(parseInt(wkParts[0]),parseInt(wkParts[1])-1,parseInt(wkParts[2]));
          const thisDayDate=new Date(wkSun.getFullYear(),wkSun.getMonth(),wkSun.getDate()+di);
          const thisDayStr=thisDayDate.getFullYear()+"-"+String(thisDayDate.getMonth()+1).padStart(2,"0")+"-"+String(thisDayDate.getDate()).padStart(2,"0");
          show=thisDayStr===activeDate||chk;
        } else { show=chk; }
      }
      if(!show&&!chk) return;

      const prio=tk.priority||4; // default to "Everything Else"
      if(buckets[prio]) buckets[prio].push({tk,cat,chk});
    });
  });

  let h='<div class="dv-top"><div><div class="dv-title">'+day+'</div>'
    +'<div style="font-size:11px;opacity:.5;letter-spacing:.5px;margin-top:2px">By Priority</div></div></div>'
    +'<div class="pv">';

  PRIORITIES.forEach(prio=>{
    const items=buckets[prio.id]||[];
    const done=items.filter(i=>i.chk).length;
    h+='<div class="pv-tier">'
      +'<div class="pv-tier-hdr">'
      +'<div class="pv-tier-num" style="background:'+prio.bg+';color:'+prio.color+'">'+prio.id+'</div>'
      +'<div class="pv-tier-name" style="color:'+prio.color+'">'+prio.emoji+' '+prio.label+'</div>'
      +(items.length?'<div class="pv-tier-count">'+done+'/'+items.length+'</div>':'')
      +'</div>';

    if(!items.length){
      h+='<div class="pv-empty">Nothing here today.</div>';
    } else {
      items.forEach(({tk,cat,chk})=>{
        const p=PALETTE[cat.color||0];
        h+='<div class="pv-task" style="border-left:3px solid '+prio.color+';opacity:'+(chk?'.5':'1')+'">'
          +'<button class="cbtn'+(chk?" chk":" hv")+'" style="'+(chk?"background:"+prio.color+";border-color:"+prio.color:"border-color:"+prio.color)+'" data-action="check" data-cat="'+cat.id+'" data-tk="'+tk.id+'">'+(chk?"&#x2713;":"")+"</button>"
          +'<div style="flex:1">'
          +'<div style="font-size:14px;font-weight:300;color:var(--ink)'+(chk?';text-decoration:line-through;color:var(--stone)':'')+'">'
          +(tk.url?'<a href="'+esc(tk.url)+'" target="_blank" style="color:inherit;text-decoration:none">'+esc(tk.name)+' 🔗</a>':esc(tk.name))
          +'</div>'
          +'<div class="pv-task-meta">'+cat.icon+' '+cat.name+(tk.startTime?' · '+fmt12(tk.startTime):'')+'</div>'
          +'</div>'
          +'</div>';
      });
    }
    h+='</div>';
  });

  // Tasks with no priority set (shouldn't happen but just in case)
  return h+'</div>';
}

// ── Schedule View ──────────────────────────────────────────────────────────────
function fmt12(t){
  if(!t) return "";
  const[h,m]=t.split(":");
  const hr=parseInt(h),mn=m||"00";
  const ampm=hr>=12?"PM":"AM";
  const h12=hr%12||12;
  return h12+":"+mn+" "+ampm;
}

function buildSchedule(){
  const day=activeDay,di=DAYS.indexOf(day),cats=getCats()||[];
  const wk=wkKey(),ch=chks();
  const chkVal=(key)=>!!(ch[key]||ch[wk+":"+key]);
  const{sunday:_scSun}=parseWk(wk);
  const _scDate=new Date(_scSun.getFullYear(),_scSun.getMonth(),_scSun.getDate()+di);
  const dayDateStr=_scDate.getFullYear()+"-"+String(_scDate.getMonth()+1).padStart(2,"0")+"-"+String(_scDate.getDate()).padStart(2,"0");
  const scheduled=[],unscheduled=[];
  cats.forEach(cat=>{
    if(!catOn(cat,di)||cat.isHabits) return;
    catAllTasks(cat,dayDateStr).forEach(tk=>{
      const chk=chkVal(day+":"+cat.id+":"+tk.id);
      const applies=(tk.freq&&tk.freq.type==="once"?onceTaskMatchesDay(tk,wk,day):fApplies(tk.freq,di))&&taskCreatedBeforeOrOnDay(tk,wk,day);
      let show=applies;
      if(tk.rollover){
        const activeDate=getActiveRolloverDate(tk,cat);
        if(activeDate){
          const wkParts=wk.split("-");
          const wkSun=new Date(parseInt(wkParts[0]),parseInt(wkParts[1])-1,parseInt(wkParts[2]));
          const thisDayDate=new Date(wkSun.getFullYear(),wkSun.getMonth(),wkSun.getDate()+di);
          const thisDayStr=thisDayDate.getFullYear()+"-"+String(thisDayDate.getMonth()+1).padStart(2,"0")+"-"+String(thisDayDate.getDate()).padStart(2,"0");
          show=thisDayStr===activeDate||chk;
        } else {show=chk;}
      }
      if(!show&&!chk) return;
      const p=PALETTE[cat.color||0];
      if(tk.startTime) scheduled.push({tk,cat,p,chk});
      else unscheduled.push({tk,cat,p,chk});
    });
  });
  scheduled.sort((a,b)=>a.tk.startTime.localeCompare(b.tk.startTime));

  let h='<div class="dv-top"><div><div class="dv-title">'+day+"</div>"
    +'<div style="font-size:11px;opacity:.5;letter-spacing:.5px;margin-top:2px">Daily Schedule</div></div>'
    +'<button class="exp-btn" data-action="export-week">&#x2B07; EXPORT</button></div>';

  if(!scheduled.length&&!unscheduled.length){
    h+='<div style="text-align:center;padding:60px 20px;opacity:.4">'
      +'<div style="font-size:44px;margin-bottom:12px">🗓</div>'
      +'<div style="font-size:15px;font-weight:600;margin-bottom:6px">No tasks scheduled</div>'
      +'<div style="font-size:13px">Add times to your tasks in ⚙️</div></div>';
    return h;
  }
  if(scheduled.length){
    scheduled.forEach(({tk,cat,p,chk})=>{
      h+='<div style="display:flex;gap:12px;margin:0 14px 10px;align-items:flex-start">'
        +'<div style="text-align:right;min-width:72px;padding-top:14px">'
        +'<div style="font-size:11px;font-weight:500;color:var(--walnut);letter-spacing:.3px">'+fmt12(tk.startTime)+"</div>"
        +(tk.endTime?'<div style="font-size:10px;opacity:.4">'+fmt12(tk.endTime)+"</div>":"")
        +"</div>"
        +'<div style="flex:1;background:var(--white);border-radius:14px;border:1px solid '+p.lt+';border-left:3px solid '+p.ac+';padding:12px 14px">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<button class="cbtn'+(chk?" chk":" hv")+'" style="'+(chk?"background:"+p.ac+";border-color:"+p.ac:"border-color:"+p.ac)+';flex-shrink:0" data-action="check" data-cat="'+cat.id+'" data-tk="'+tk.id+'">'+(chk?"&#x2713;":"")+"</button>"
        +'<div style="flex:1">'
        +'<div style="font-size:14px;font-weight:400;color:var(--ink)'+(chk?";text-decoration:line-through;color:var(--stone)":"")+'">'+(tk.url?'<a href="'+esc(tk.url)+'" target="_blank" style="color:inherit;text-decoration:none">'+esc(tk.name)+' 🔗</a>':esc(tk.name))+"</div>"
        +'<div style="font-size:10px;opacity:.4;margin-top:2px;letter-spacing:.5px">'+cat.icon+" "+cat.name+"</div>"
        +"</div></div></div></div>";
    });
  }
  if(unscheduled.length){
    h+=divider("As Time Allows");
    unscheduled.forEach(({tk,cat,p,chk})=>{
      h+='<div style="margin:0 14px 10px;background:var(--white);border-radius:14px;border:1px solid '+p.lt+';padding:12px 14px">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<button class="cbtn'+(chk?" chk":" hv")+'" style="'+(chk?"background:"+p.ac+";border-color:"+p.ac:"border-color:"+p.ac)+'" data-action="check" data-cat="'+cat.id+'" data-tk="'+tk.id+'">'+(chk?"&#x2713;":"")+"</button>"
        +'<div style="flex:1">'
        +'<div style="font-size:14px;font-weight:400;color:var(--ink)'+(chk?";text-decoration:line-through;color:var(--stone)":"")+'">'+(tk.url?'<a href="'+esc(tk.url)+'" target="_blank" style="color:inherit;text-decoration:none">'+esc(tk.name)+' 🔗</a>':esc(tk.name))+"</div>"
        +'<div style="font-size:10px;opacity:.4;margin-top:2px;letter-spacing:.5px">'+cat.icon+" "+cat.name+"</div>"
        +"</div></div></div>";
    });
  }
  return h+"<div style='height:40px'></div>";
}

// ── Dashboard ──────────────────────────────────────────────────────────────────
function buildDash(){
  const cats=getCats()||[];
  const allWks=Object.keys(_checks);
  const mWks=allWks.filter(k=>{const{month,year}=parseWk(k);return month===dashM&&year===dashY;}).sort();
  let mDone=0,mTotal=0;const ct={};cats.forEach(c=>{ct[c.id]={done:0,total:0}});
  const wSums=mWks.map(wk=>{
    let wd=0,wt=0;
    DAYS.forEach(d=>cats.forEach(cat=>{const p=catProg(cat,d,wk);wd+=p.done;wt+=p.total;ct[cat.id].done+=p.done;ct[cat.id].total+=p.total;}));
    mDone+=wd;mTotal+=wt;
    const{sunday}=parseWk(wk);const e=new Date(sunday);e.setDate(sunday.getDate()+6);
    return{label:MONTHS[sunday.getMonth()].slice(0,3)+" "+sunday.getDate()+"–"+e.getDate(),done:wd,total:wt};
  });
  const now=new Date(),canN=!(dashY===now.getFullYear()&&dashM>=now.getMonth());
  const mp=mTotal?Math.round((mDone/mTotal)*100):0;
  let h='<div class="dv"><div class="mnav">'
    +'<button class="mnav-btn" data-action="dash-prev">‹</button>'
    +'<div><div class="m-title">'+MONTHS[dashM]+" "+dashY+'</div><div class="m-sub">'+mWks.length+" week"+(mWks.length!==1?"s":"")+" tracked</div></div>"
    +'<button class="mnav-btn" data-action="dash-next"'+(canN?"":" disabled style=\"opacity:.3;cursor:default\"")+">›</button></div>";
  if(!mWks.length){h+='<div class="empty"><div style="font-size:44px;margin-bottom:12px">📭</div><div style="font-size:14px">No data for this month yet.</div></div>';}
  else{
    h+='<div class="ov-card"><div class="ov-lbl">OVERALL COMPLETION</div><div class="ov-pct">'+mp+'%</div><div class="ov-frac">'+mDone+" of "+mTotal+" tasks</div></div>"
      +'<button class="exp-gold" data-action="export-month">&#x2B07; EXPORT '+MONTHS[dashM].toUpperCase()+' CSV</button>'
      +'<div class="sec-ttl">By Category</div>';
    cats.forEach(cat=>{
      const p=PALETTE[cat.color||0],{done,total}=ct[cat.id];
      const pct=total?Math.round((done/total)*100):0;
      h+='<div class="ccat" style="border:2px solid '+p.lt+'">'
        +'<div class="ccat-top"><span class="ccat-lbl" style="color:'+p.ac+'">'+cat.icon+" "+cat.name+"</span>"
        +'<span class="ccat-pct" style="color:'+p.ac+'">'+pct+"%</span></div>"
        +'<div class="cbar-w"><div class="cbar" style="width:'+pct+'%;background:'+p.ac+'"></div></div>'
        +'<div class="cfrac">'+done+" of "+total+" tasks</div></div>";
    });
    h+='<div class="sec-ttl">By Week</div>';
    wSums.forEach(({label,done,total})=>{
      const pct=total?Math.round((done/total)*100):0;
      h+='<div class="wsc"><div class="wsc-top"><span class="wsc-lbl">'+label+"</span><span class=\"wsc-pct\">"+pct+"%</span></div>"
        +'<div class="cbar-w"><div class="cbar" style="width:'+pct+'%;background:var(--walnut)"></div></div>'
        +'<div class="wsc-frac">'+done+"/"+total+" tasks</div></div>";
    });
  }
  return h+"</div>";
}

      +'</div>';

      h+='<div style="text-align:center;padding:30px 20px;opacity:.5;font-size:13px">No categories yet. Add one above!</div>';
    }
    cats.forEach((cat,ci)=>{
      const p=PALETTE[cat.color||0];
      const isOpen=openSec===("setup_"+cat.id);
      const visibleTasks=(cat.tasks||[]).filter(tk=>{
        if(tk.freq&&tk.freq.type==="once"){
          const allChks=_checks||{};
          const completed=Object.keys(allChks).some(w=>Object.keys(allChks[w]).some(k=>k.includes(cat.id+":"+tk.id)&&allChks[w][k]));
          return !completed;
        }
        return true;
      });
      const dayOrder={daily:-1,days:0,weekly:1,monthly:2,annually:3,once:4};
      const sortedTasks=[...visibleTasks].sort((a,b)=>{
        const fa=a.freq||{type:"daily"},fb=b.freq||{type:"daily"};
        const oa=dayOrder[fa.type]??0,ob=dayOrder[fb.type]??0;
        if(oa!==ob) return oa-ob;
        return 0;
      });
      const priLabel=(tk)=>{const pr=PRIORITIES.find(p=>p.id===(tk.priority||4));return pr?pr.emoji+" "+pr.label:"";};
      h+='<div class="s-cat" style="border-color:'+p.lt+'">';
      h+='<div class="s-cat-hdr" data-action="toggle-sec" data-sec="setup_'+cat.id+'" style="cursor:pointer">'
        +'<span style="font-size:22px">'+cat.icon+"</span>"
        +'<div style="flex:1"><div class="s-cat-name" style="color:'+p.ac+'">'+cat.name+"</div>"
        +'<div class="s-cat-freq">'+fLabel(cat.freq)+(sortedTasks.length>0?" · "+sortedTasks.length+" task"+(sortedTasks.length!==1?"s":""):"")+"</div></div>"
        +'<div class="s-cat-btns">'
        +(ci>0?'<button class="ibtn" data-action="cat-up" data-ci="'+ci+'"><span style="pointer-events:none">↑</span></button>':"")
        +(ci<cats.length-1?'<button class="ibtn" data-action="cat-dn" data-ci="'+ci+'"><span style="pointer-events:none">↓</span></button>':"")
        +'<button class="ibtn" data-action="edit-cat" data-cat="'+cat.id+'"><span style="pointer-events:none">✏️</span></button>'
        +'<button class="ibtn" data-action="del-cat" data-cat="'+cat.id+'"><span style="pointer-events:none">🗑️</span></button>'
        +'<span style="font-size:14px;opacity:.3;margin-left:2px">'+(isOpen?"▾":"▸")+"</span>"
        +"</div></div>";
      if(isOpen){
        if(sortedTasks.length>0){
          h+='<div class="s-tasks">';
          sortedTasks.forEach(tk=>{
            h+='<div class="s-task">'
              +'<div style="flex:1"><div class="s-task-name">'+esc(tk.name)+(tk.rollover?' <span style="font-size:10px;opacity:.5">↻</span>':"")+(tk.url?' <span style="font-size:12px;opacity:.5">🔗</span>':"")+"</div>"
              +'<div class="s-task-freq">'+fLabel(tk.freq)+" · "+priLabel(tk)+"</div></div>"
              +'<button class="ibtn" data-action="edit-task" data-cat="'+cat.id+'" data-task="'+tk.id+'"><span style="pointer-events:none">✏️</span></button>'
              +'<button class="ibtn" data-action="del-task" data-cat="'+cat.id+'" data-task="'+tk.id+'"><span style="pointer-events:none">🗑️</span></button>'
              +"</div>";
          });
          h+="</div>";
        }
        h+='<div style="padding:0 15px 14px">'
          +'<button class="more-btn" data-action="new-task" data-cat="'+cat.id+'">+ Add Task</button>'
          +"</div>";
        h+=buildRoutinesPanel(cat,p);
      }
      h+="</div>";
    });
    h+="</div>";
  }

  // ── DATA section
  const dataOpen=setupOpen==="data";
  h+=setupSection("data","💾","DATA",dataOpen);
  if(dataOpen){
    h+='<div style="padding:0 0 16px;display:flex;flex-direction:column;gap:10px">'
      +'<div style="font-size:12px;color:var(--walnut);line-height:1.6;padding:12px;background:var(--greige);border-radius:10px">Export saves all your categories and tasks. Import restores them from a backup file.</div>'
      +'<button class="done-btn" data-action="export-all" style="background:var(--walnut)">⬇ Export Backup</button>'
      +'<button class="add-cat-btn" data-action="import-all">⬆ Import Backup</button>'
      +"</div>";
  }

  // ── DASH section
  const dashOpen=setupOpen==="dash";
  h+=setupSection("dash","📈","DASHBOARD",dashOpen);
  if(dashOpen){
    h+='<div style="padding:0 0 16px">';
    h+=buildDashInSetup();
    h+="</div>";
  }

  // ── GO TO PLANNER
  h+='<button class="done-btn" data-action="go-planner" style="margin-top:8px">✓ Go to Planner</button>';

  return h+"</div>";
}

function setupSection(id,icon,label,isOpen){
  return '<div style="background:var(--white);border-radius:14px;border:1px solid #EDE8E2;margin-bottom:10px;overflow:hidden">'
    +'<button style="width:100%;padding:16px;background:'+(isOpen?"var(--greige)":"var(--white)")+';border:none;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;font-family:Jost,sans-serif" data-action="toggle-setup-sec" data-sec="'+id+'">'
    +'<span style="font-size:20px">'+icon+"</span>"
    +'<span style="font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--mocha);flex:1">'+label+"</span>"
    +'<span style="font-size:14px;opacity:.3;color:var(--walnut)">'+(isOpen?"▾":"▸")+"</span>"
    +"</button>"
    +(isOpen?'<div style="padding:0 16px">':"")
    +(isOpen?"</div>":"");
}

function buildDashInSetup(){
  const cats=getCats()||[];
  const now=new Date();
  let h="";

  // ── WEEK sub-section
  const wkOpen=dashSubOpen==="week";
  h+=dashSubHdr("week","Week",wkOpen);
  if(wkOpen){
    const wk=wkKey();
    const{sunday}=parseWk(wk);
    const end=new Date(sunday);end.setDate(sunday.getDate()+6);
    const wkLabel=MONTHS[sunday.getMonth()].slice(0,3)+" "+sunday.getDate()+" – "+MONTHS[end.getMonth()].slice(0,3)+" "+end.getDate()+", "+end.getFullYear();
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      +'<button class="mnav-btn" data-action="prev">‹</button>'
      +'<div style="font-family:Cormorant Garamond,serif;font-size:16px;font-weight:600;font-style:italic;color:var(--mocha);text-align:center">'+wkLabel+"</div>"
      +'<button class="mnav-btn" data-action="next">›</button></div>';
    let wkDone=0,wkTotal=0;
    const byCat=[];
    cats.forEach(cat=>{
      let cd=0,ct=0;
      DAYS.forEach(d=>{const p=catProg(cat,d,wk);cd+=p.done;ct+=p.total;});
      wkDone+=cd;wkTotal+=ct;
      if(ct>0) byCat.push({name:cat.name,icon:cat.icon,color:cat.color,done:cd,total:ct});
    });
    const byDay=DAYS.map((d,di)=>{
      const wkSun=new Date(sunday);
      const dayDate=new Date(wkSun.getFullYear(),wkSun.getMonth(),wkSun.getDate()+di);
      const dateStr=(dayDate.getMonth()+1)+"/"+dayDate.getDate();
      const p=dayProg(d,wk);
      return{name:d.slice(0,3),date:dateStr,done:p.done,total:p.total};
    });
    const wkPct=wkTotal?Math.round(wkDone/wkTotal*100):0;
    if(!wkTotal){
      h+='<div style="text-align:center;padding:20px;opacity:.35;font-size:13px">No data for this week.</div>';
    } else {
      h+=statCard(wkPct,wkDone,wkTotal,"Week of "+MONTHS[sunday.getMonth()].slice(0,3)+" "+sunday.getDate());
      h+='<div style="margin-bottom:12px">';
      byDay.forEach(d=>{if(!d.total) return;const pct=Math.round(d.done/d.total*100);h+=miniBar(d.name+" "+d.date,d.done,d.total,pct);});
      h+="</div>";
      if(byCat.length){
        h+='<div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin-bottom:8px">By Category</div>';
        byCat.forEach(c=>{const pct=Math.round(c.done/c.total*100);h+=miniBar(c.icon+" "+c.name,c.done,c.total,pct,PALETTE[c.color||0].ac);});
      }
      h+='<button class="exp-gold" data-action="export-week" style="margin-top:12px">⬇ Download Week CSV</button>';
    }
  }

  // ── MONTH sub-section
  const moOpen=dashSubOpen==="month";
  h+=dashSubHdr("month","Month",moOpen);
  if(moOpen){
    const canN=!(dashY===now.getFullYear()&&dashM>=now.getMonth());
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      +'<button class="mnav-btn" data-action="dash-prev">‹</button>'
      +'<div style="font-family:Cormorant Garamond,serif;font-size:18px;font-weight:600;font-style:italic;color:var(--mocha)">'+MONTHS[dashM]+" "+dashY+"</div>"
      +'<button class="mnav-btn" data-action="dash-next"'+(canN?"":' disabled style="opacity:.3;cursor:default"')+">›</button></div>";
    const daysInMonth=new Date(dashY,dashM+1,0).getDate();
    let mDone=0,mTotal=0;
    const byCatM={};cats.forEach(c=>{byCatM[c.id]={name:c.name,icon:c.icon,color:c.color,done:0,total:0};});
    const byWeekM=[];
    Object.keys(_checks).sort().forEach(wk=>{
      const{sunday}=parseWk(wk);
      let wkDone=0,wkTotal=0,wkLabel="";
      DAYS.forEach((day,di)=>{
        const d=new Date(sunday.getFullYear(),sunday.getMonth(),sunday.getDate()+di);
        if(d.getMonth()!==dashM||d.getFullYear()!==dashY) return;
        if(!wkLabel) wkLabel=(d.getMonth()+1)+"/"+d.getDate();
        cats.forEach(cat=>{
          const p=catProg(cat,day,wk);
          wkDone+=p.done;wkTotal+=p.total;
          if(byCatM[cat.id]){byCatM[cat.id].done+=p.done;byCatM[cat.id].total+=p.total;}
        });
      });
      mDone+=wkDone;mTotal+=wkTotal;
      if(wkTotal>0) byWeekM.push({label:"Week of "+wkLabel,done:wkDone,total:wkTotal});
    });
    const mPct=mTotal?Math.round(mDone/mTotal*100):0;
    if(!mTotal){
      h+='<div style="text-align:center;padding:20px;opacity:.35;font-size:13px">No data for this month yet.</div>';
    } else {
      h+=statCard(mPct,mDone,mTotal,MONTHS[dashM]+" "+dashY);
      byWeekM.forEach(w=>{const pct=Math.round(w.done/w.total*100);h+=miniBar(w.label,w.done,w.total,pct);});
      const catArr=Object.values(byCatM).filter(c=>c.total>0);
      if(catArr.length){
        h+='<div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin:12px 0 8px">By Category</div>';
        catArr.forEach(c=>{const pct=Math.round(c.done/c.total*100);h+=miniBar(c.icon+" "+c.name,c.done,c.total,pct,PALETTE[cats.find(x=>x.name===c.name)?.color||0]?.ac);});
      }
      h+='<button class="exp-gold" data-action="export-month" style="margin-top:12px">⬇ Download '+MONTHS[dashM]+' CSV</button>';
    }
  }

  // ── YEAR sub-section
  const yrOpen=dashSubOpen==="year";
  h+=dashSubHdr("year","Year",yrOpen);
  if(yrOpen){
    const canNY=dashY<now.getFullYear();
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      +'<button class="mnav-btn" data-action="dash-year-prev">‹</button>'
      +'<div style="font-family:Cormorant Garamond,serif;font-size:18px;font-weight:600;font-style:italic;color:var(--mocha)">'+dashY+"</div>"
      +'<button class="mnav-btn" data-action="dash-year-next"'+(canNY?"":' disabled style="opacity:.3;cursor:default"')+">›</button></div>";
    let yrDone=0,yrTotal=0;
    const byMonthY=[];
    for(let m=0;m<12;m++){
      let mDone=0,mTotal=0;
      Object.keys(_checks).forEach(wk=>{
        const{sunday}=parseWk(wk);
        DAYS.forEach((day,di)=>{
          const d=new Date(sunday.getFullYear(),sunday.getMonth(),sunday.getDate()+di);
          if(d.getMonth()!==m||d.getFullYear()!==dashY) return;
          cats.forEach(cat=>{const p=catProg(cat,day,wk);mDone+=p.done;mTotal+=p.total;});
        });
      });
      yrDone+=mDone;yrTotal+=mTotal;
      if(mTotal>0) byMonthY.push({label:MONTHS[m].slice(0,3),done:mDone,total:mTotal});
    }
    const yrPct=yrTotal?Math.round(yrDone/yrTotal*100):0;
    if(!yrTotal){
      h+='<div style="text-align:center;padding:20px;opacity:.35;font-size:13px">No data for '+dashY+' yet.</div>';
    } else {
      h+=statCard(yrPct,yrDone,yrTotal,dashY+" Overview");
      byMonthY.forEach(m=>{const pct=Math.round(m.done/m.total*100);h+=miniBar(m.label,m.done,m.total,pct);});
      h+='<button class="exp-gold" data-action="export-year" style="margin-top:12px">⬇ Download '+dashY+' CSV</button>';
    }
  }

  // ── CUSTOM sub-section
  const custOpen=dashSubOpen==="custom";
  h+=dashSubHdr("custom","Custom Range",custOpen);
  if(custOpen){
    const today=(()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");})();
    h+='<div class="mo-lbl" style="margin-top:0">Start Date</div>'
      +'<input class="mo-inp" type="date" id="custom_start" value="'+(customStart||today)+'" style="font-family:Jost,sans-serif;font-size:14px;margin-bottom:10px">'
      +'<div class="mo-lbl">End Date</div>'
      +'<input class="mo-inp" type="date" id="custom_end" value="'+(customEnd||today)+'" style="font-family:Jost,sans-serif;font-size:14px;margin-bottom:14px">'
      +'<button class="done-btn" data-action="custom-range-go" style="margin-bottom:14px">View Range</button>';
    if(customStart&&customEnd&&customRangeData){
      const{done,total,pct,byCat}=customRangeData;
      h+=statCard(pct,done,total,customStart+" to "+customEnd);
      if(byCat.length){
        h+='<div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin-bottom:8px">By Category</div>';
        byCat.forEach(c=>{const p=Math.round(c.done/c.total*100);h+=miniBar(c.icon+" "+c.name,c.done,c.total,p,PALETTE[c.color||0]?.ac);});
      }
      h+='<button class="exp-gold" data-action="export-custom" style="margin-top:12px">⬇ Download Range CSV</button>';
    }
  }

  return h;
}


function dashSubHdr(id,label,isOpen){
  return '<div style="margin-bottom:8px">'
    +'<button style="width:100%;padding:12px 14px;background:'+(isOpen?"var(--greige)":"rgba(255,255,255,.6)")+';border:1px solid #EDE8E2;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left;font-family:Jost,sans-serif" data-action="toggle-dash-sub" data-sub="'+id+'">'
    +'<span style="font-size:13px;font-weight:500;color:var(--mocha);flex:1">'+label+"</span>"
    +'<span style="font-size:13px;opacity:.3">'+(isOpen?"▾":"▸")+"</span>"
    +"</button></div>";
}

function statCard(pct,done,total,label){
  return '<div style="background:var(--greige);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px">'
    +'<div style="font-size:9px;letter-spacing:3px;text-transform:uppercase;opacity:.5;margin-bottom:6px">'+label+"</div>"
    +'<div style="font-family:Cormorant Garamond,serif;font-size:52px;font-weight:600;color:var(--mocha);font-style:italic;line-height:1">'+pct+"%</div>"
    +'<div style="font-size:11px;opacity:.5;margin-top:6px">'+done+" of "+total+" tasks</div>"
    +"</div>";
}

function miniBar(label,done,total,pct,color){
  color=color||"var(--walnut)";
  return '<div style="margin-bottom:8px">'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:4px">'
    +'<div style="font-size:12px;color:var(--ink)">'+label+"</div>"
    +'<div style="font-size:12px;font-weight:500;color:var(--walnut)">'+pct+"%</div>"
    +"</div>"
    +'<div style="height:4px;background:var(--greige);border-radius:2px;overflow:hidden">'
    +'<div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:2px;transition:width .3s"></div>'
    +"</div>"
    +'<div style="font-size:10px;opacity:.35;margin-top:2px">'+done+"/"+total+"</div>"
    +"</div>";
}


// ── Routines UI (setup) ────────────────────────────────────────────────────────
function buildRoutinesPanel(cat,p){
  const routines=cat.routines||[];
  let h='<div style="padding:0 15px 14px;border-top:1px solid #F0EDE8;margin-top:2px">'
    +'<div style="font-size:9px;letter-spacing:2px;text-transform:uppercase;opacity:.4;margin:14px 0 10px">Routines</div>';
  if(!routines.length){
    h+='<div style="font-size:12px;opacity:.4;font-style:italic;margin-bottom:10px">No saved routines yet. Save your current tasks as one below.</div>';
  }
  routines.forEach(rt=>{
    const isActive=cat.activeRoutineId===rt.id;
    const isOpenR=openRoutine===rt.id;
    const n=(rt.tasks||[]).length;
    h+='<div style="background:'+(isActive?"var(--greige)":"var(--white)")+';border-radius:10px;margin-bottom:8px;overflow:hidden;border:1.5px solid '+(isActive?p.ac:"#EDE8E2")+'">'
      +'<div style="display:flex;align-items:center;gap:8px;padding:10px 12px">'
      +'<button data-action="toggle-routine" data-cat="'+cat.id+'" data-routine="'+rt.id+'" style="flex-shrink:0;width:36px;height:20px;border-radius:20px;border:none;background:'+(isActive?p.ac:"#DDD5CC")+';position:relative;cursor:pointer">'
      +'<span style="position:absolute;top:2px;'+(isActive?"right:2px":"left:2px")+';width:16px;height:16px;border-radius:50%;background:white;display:block"></span>'
      +'</button>'
      +'<div style="flex:1" data-action="toggle-routine-panel" data-routine="'+rt.id+'">'
      +'<div style="font-size:12px;font-weight:600;color:'+(isActive?p.ac:"var(--ink)")+'">'+esc(rt.name)+(isActive?" · Active":"")+'</div>'
      +'<div style="font-size:10px;opacity:.4">'+n+' task'+(n!==1?"s":"")+'</div></div>'
      +'<button class="ibtn" data-action="toggle-routine-panel" data-routine="'+rt.id+'"><span style="pointer-events:none">'+(isOpenR?"▾":"▸")+'</span></button>'
      +'<button class="ibtn" data-action="rename-routine" data-cat="'+cat.id+'" data-routine="'+rt.id+'"><span style="pointer-events:none">✏️</span></button>'
      +'<button class="ibtn" data-action="del-routine" data-cat="'+cat.id+'" data-routine="'+rt.id+'"><span style="pointer-events:none">🗑️</span></button>'
      +'</div>';
    if(isOpenR){
      h+='<div style="padding:0 12px 12px">';
      (rt.tasks||[]).forEach(tk=>{
        h+='<div class="s-task">'
          +'<div style="flex:1"><div class="s-task-name">'+esc(tk.name)+'</div>'
          +'<div class="s-task-freq">'+fLabel(tk.freq)+'</div></div>'
          +'<button class="ibtn" data-action="edit-routine-task" data-cat="'+cat.id+'" data-routine="'+rt.id+'" data-task="'+tk.id+'"><span style="pointer-events:none">✏️</span></button>'
          +'<button class="ibtn" data-action="del-routine-task" data-cat="'+cat.id+'" data-routine="'+rt.id+'" data-task="'+tk.id+'"><span style="pointer-events:none">🗑️</span></button>'
          +'</div>';
      });
      if(!n) h+='<div style="font-size:12px;opacity:.4;font-style:italic;padding:6px 0">No tasks in this routine yet.</div>';
      h+='<button class="more-btn" data-action="new-routine-task" data-cat="'+cat.id+'" data-routine="'+rt.id+'">+ Add Task to Routine</button>';
      h+='</div>';
    }
    h+='</div>';
  });
  h+='<button class="more-btn" data-action="save-as-routine" data-cat="'+cat.id+'" style="margin-top:6px">+ Save Current Tasks as Routine</button>';
  h+='</div>';
  return h;
}

function modalQS(){
  const existing=new Set((getCats()||[]).map(c=>c.name));
  let h='<div class="mo-title">Add Category</div><div class="mo-lbl">Quick Start</div>';

// ── Rollover helpers ───────────────────────────────────────────────────────────
function getActiveRolloverDate(tk,cat){
  let startDate;
  if(tk.freq&&tk.freq.type==="once"&&tk.freq.date&&tk.freq.month!==undefined&&tk.freq.year){
    startDate=new Date(tk.freq.year,tk.freq.month,tk.freq.date);
  } else if(tk.createdAt){
    const p=tk.createdAt.split("-");
    startDate=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  } else {return null;}
  const today=new Date();today.setHours(0,0,0,0);startDate.setHours(0,0,0,0);
  if(startDate>today){
    return startDate.getFullYear()+"-"+String(startDate.getMonth()+1).padStart(2,"0")+"-"+String(startDate.getDate()).padStart(2,"0");
  }
  let d=new Date(startDate);
  for(let i=0;i<60;i++){
    const dayName=DAYS[d.getDay()];
    const sun=new Date(d.getFullYear(),d.getMonth(),d.getDate()-d.getDay());
    const wkStr=sun.getFullYear()+"-"+String(sun.getMonth()+1).padStart(2,"0")+"-"+String(sun.getDate()).padStart(2,"0");
    const ch=_checks[wkStr]||{};
    const checked=!!(ch[dayName+":"+cat.id+":"+tk.id]);
    if(checked) return null;
    const dateStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    if(d.getTime()===today.getTime()) return dateStr;
    d.setDate(d.getDate()+1);
    if(d>today) return today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  }
  return null;
}

function taskCreatedBeforeOrOnDay(tk,wk,day){
  // once tasks always show on their exact date regardless of createdAt
  if(tk.freq&&tk.freq.type==="once") {
    if(tk.endDate){
      const{sunday}=parseWk(wk);const di=DAYS.indexOf(day);
      const d=new Date(sunday);d.setDate(sunday.getDate()+di);
      const dateStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      if(dateStr>tk.endDate) return false;
    }
    return true;
  }
  if(!tk.createdAt) return true;
  const{sunday}=parseWk(wk);const di=DAYS.indexOf(day);
  const d=new Date(sunday);d.setDate(sunday.getDate()+di);
  const dateStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(tk.deletedAfter&&dateStr>=tk.deletedAfter) return false;
  if(tk.endDate&&dateStr>tk.endDate) return false;
  return tk.createdAt<=dateStr;
}

function freqUI(pfx,isCat){
  const f=mFreq;
  const types=[["daily","Every Day"],["days","Specific Days"],["weekly","Weekly"],["monthly","Monthly"],["annually","Annually"],["once","One Time"]];
  if(isCat) types.push(["task-days","Task Days Only"]);
  let h='<div class="fgrid" id="'+pfx+'_fbtns">';
  types.forEach(([t,l])=>{h+='<button class="fbtn'+(f.type===t?" active":"")+'" data-freq-type="'+t+'">'+l+"</button>";});
  h+='</div><div id="'+pfx+'_fextra" style="margin-top:12px">'+freqExtra(f,pfx)+"</div>";
  return h;
}
function freqExtra(f,pfx){
  pfx=pfx||'freq';
  if(f.type==="days"){
    return'<div class="dgrid">'+DAYS.map((d,i)=>'<button class="dchip'+((f.days||[]).includes(i)?" active":"")+'" data-day-pick="'+i+'">'+d.slice(0,3)+"</button>").join("")+"</div>";
  }
  if(f.type==="weekly"){
    return'<div class="mo-lbl">Which day?</div><div class="dgrid">'+DAYS.map((d,i)=>'<button class="dchip'+((f.day||0)===i?" active":"")+'" data-weekday-pick="'+i+'">'+d.slice(0,3)+"</button>").join("")+"</div>";
  }
  if(f.type==="monthly"){
    return'<div class="mo-lbl">Day of month</div><input class="mo-inp sm" type="number" min="1" max="31" value="'+(f.date||1)+'" id="'+pfx+'_date" style="width:100px">';
  }
  if(f.type==="annually"){
    return'<div class="mo-lbl">Month and Day</div><div class="mrow">'
      +'<select class="mo-inp sm" id="'+pfx+'_month">'+MONTHS.map((m,i)=>'<option value="'+i+'"'+((f.month||0)===i?" selected":"")+">"+m+"</option>").join("")+"</select>"
      +'<input class="mo-inp sm" type="number" min="1" max="31" value="'+(f.date||1)+'" id="'+pfx+'_date">'
      +"</div>";
  }
  if(f.type==="once"){
    const now=new Date();
    const yr=f.year||now.getFullYear();
    const mo=String((f.month!==undefined?f.month:now.getMonth())+1).padStart(2,"0");
    const dy=String(f.date||now.getDate()).padStart(2,"0");
    const val=yr+"-"+mo+"-"+dy;
    return'<div class="mo-lbl">Date</div>'
      +'<input class="mo-inp" type="date" id="'+pfx+'_datepicker" value="'+val+'" style="font-family:Jost,sans-serif;font-size:14px">';
  }
  return "";
}
function refreshFreqExtra(){
  ["mcat","mtask"].forEach(pfx=>{
    const el=document.getElementById(pfx+"_fextra");
    if(el) el.innerHTML=freqExtra(mFreq,pfx);
  });
}

// ── Double tap to flip task row ────────────────────────────────────────────────
let lastTap={row:null,time:0};
document.addEventListener("touchend",function(e){
  const row=e.target.closest(".task-row");
  if(!row) return;
  if(e.target.closest(".cbtn")||e.target.closest("a")||e.target.closest(".task-back")) return;
  const now=Date.now();
  if(lastTap.row===row&&now-lastTap.time<350){
    flipRow(row);
    lastTap={row:null,time:0};
  } else {
    lastTap={row,time:now};
  }
},{passive:true});
function flipRow(row){
  const front=row.querySelector(".task-front"),back=row.querySelector(".task-back");
  if(!front||!back) return;front.style.display="none";back.style.display="block";
}
function unflipRow(row){
  const front=row.querySelector(".task-front"),back=row.querySelector(".task-back");
  if(!front||!back) return;back.style.display="none";front.style.display="flex";
}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// Track selected priority in modal
let mPriority=4;

document.addEventListener("click",function(e){
  const ip=e.target.closest("[data-icon-pick]");
  if(ip){document.querySelectorAll(".ichip").forEach(b=>b.classList.remove("active"));ip.classList.add("active");return;}
  const cp=e.target.closest("[data-color-pick]");
  if(cp){document.querySelectorAll(".csw").forEach(b=>b.classList.remove("active"));cp.classList.add("active");return;}
  const pp=e.target.closest("[data-priority-pick]");
  if(pp){
    mPriority=parseInt(pp.dataset.priorityPick);
    document.querySelectorAll(".pbtn").forEach(b=>b.classList.toggle("active",parseInt(b.dataset.priorityPick)===mPriority));
    return;
  }
  const dp=e.target.closest("[data-day-pick]");
  if(dp){
    const i=parseInt(dp.dataset.dayPick);
    mFreq.days=mFreq.days||[];
    const idx=mFreq.days.indexOf(i);idx>=0?mFreq.days.splice(idx,1):mFreq.days.push(i);
    mFreq.days.sort();refreshFreqExtra();return;
  }
  const wp=e.target.closest("[data-weekday-pick]");
  if(wp){mFreq.day=parseInt(wp.dataset.weekdayPick);refreshFreqExtra();return;}
  const ft=e.target.closest("[data-freq-type]");
  if(ft){
    mFreq={type:ft.dataset.freqType};
    document.querySelectorAll(".fbtn").forEach(b=>b.classList.toggle("active",b.dataset.freqType===mFreq.type));
    refreshFreqExtra();return;
  }
  const lbl=e.target.closest("[data-focus]");
  if(lbl){const inp=document.getElementById(lbl.dataset.focus);if(inp){inp.style.display="block";lbl.style.display="none";inp.focus();}return;}
  if(e.target.id==="pin-submit"){checkPin();return;}

  const btn=e.target.closest("[data-action]");
  if(!btn) return;
  const a=btn.dataset.action;

  if(a==="prev"){wkOff--;render();return;}
  if(a==="next"){wkOff++;render();return;}
  if(a==="today"){wkOff=0;activeDay=todayName();render();return;}
  if(a==="setup"||a==="go-setup"){mode="setup";render();return;}
  if(a==="go-planner"){mode="planner";render();return;}
  if(a==="close-modal"){closeModal();return;}
  if(a.startsWith("view-")){view=a.slice(5);openSec=null;render();return;}
  if(a.startsWith("day-")){
    activeDay=a.slice(4);
    if(view==="dashboard") view="day";
    openSec=null;render();return;
  }
  if(a==="toggle-sec"){openSec=openSec===btn.dataset.sec?null:btn.dataset.sec;renderMain();return;}
  if(a==="toggle-setup-sec"){
    setupOpen=setupOpen===btn.dataset.sec?null:btn.dataset.sec;
    openSec=null;
    document.getElementById("main").innerHTML=buildSetup();
    document.getElementById("main").style.paddingTop=document.getElementById("header").offsetHeight+"px";
    return;
  }
  if(a==="toggle-dash-sub"){
    dashSubOpen=dashSubOpen===btn.dataset.sub?null:btn.dataset.sub;
    document.getElementById("main").innerHTML=buildSetup();
    document.getElementById("main").style.paddingTop=document.getElementById("header").offsetHeight+"px";
    return;
  }
  if(a==="export-all"){exportAll();return;}
  if(a==="import-all"){importAll();return;}
  if(a==="export-week"){exportWeek();return;}
  if(a==="export-month"){exportMonth();return;}
  if(a==="export-year"){exportYear();return;}
  if(a==="dash-prev"){dashM--;if(dashM<0){dashM=11;dashY--;}renderSetupSection("dash");return;}
  if(a==="dash-next"){dashM++;if(dashM>11){dashM=0;dashY++;}renderSetupSection("dash");return;}
  if(a==="dash-year-prev"){dashY--;renderSetupSection("dash");return;}
  if(a==="dash-year-next"){if(dashY<new Date().getFullYear()){dashY++;renderSetupSection("dash");}return;}
  if(a==="check"){
    const{cat,tk}=btn.dataset;
    const iid="wi_"+cat+"_"+tk.replace(/[^a-z0-9]/gi,"_");
    const inp=document.getElementById(iid);
    const isFixed=!inp;
    if(!isFixed&&!inp.value.trim()) return;
    toggle(cat,tk);return;
  }
  if(a==="new-cat"){modalQS();return;}
  if(a==="custom-cat"){mCatId=null;modalCat(null);return;}
  if(a==="qs-pick"){
    const q=QS[parseInt(btn.dataset.qi)];if(!q)return;
    const cats=getCats()||[];
    cats.push({id:"cat_"+Date.now(),name:q.name,icon:q.icon,color:q.color,freq:{type:"daily"},tasks:[],isHabits:q.isHabits||false});
    saveCats(cats);closeModal();renderMain();return;
  }
  if(a==="edit-cat"){modalCat(btn.dataset.cat);return;}
  if(a==="save-cat"){
    const name=(document.getElementById("mcat_name")||{}).value||"";
    if(!name.trim()){alert("Please enter a category name.");return;}
    const icon=document.querySelector(".ichip.active")?.dataset.iconPick||"✅";
    const color=parseInt(document.querySelector(".csw.active")?.dataset.colorPick||"0");
    if(mFreq.type==="once"){
      const dp=document.getElementById("mcat_datepicker");
      if(dp&&dp.value){const parts=dp.value.split("-");mFreq.year=parseInt(parts[0]);mFreq.month=parseInt(parts[1])-1;mFreq.date=parseInt(parts[2]);}
    } else {
      const fd=document.getElementById("mcat_date");if(fd)mFreq.date=parseInt(fd.value);
      const fm=document.getElementById("mcat_month");if(fm)mFreq.month=parseInt(fm.value);
      const fy=document.getElementById("mcat_year");if(fy)mFreq.year=parseInt(fy.value);

    if(mCatId){const cat=cats.find(c=>c.id===mCatId);if(cat){cat.name=name.trim().toUpperCase();cat.icon=icon;cat.color=color;cat.freq=Object.assign({},mFreq);}}
    else{cats.push({id:"cat_"+Date.now(),name:name.trim().toUpperCase(),icon,color,freq:Object.assign({},mFreq),tasks:[]});}

    const cid=mCatId;

      +'<div style="font-size:12px;opacity:.5;margin-bottom:24px">This will permanently delete this category and all its tasks.</div>'
      +'<button class="mo-del" data-action="del-cat-confirm" data-cat="'+cid+'"><span style="pointer-events:none">🗑️ Yes, Delete Category</span></button>'
      +'<button class="mo-cancel" data-action="close-modal">Cancel</button>'
    );

    mCatId=btn.dataset.cat;mTaskId=null;mPriority=4;modalTask(btn.dataset.cat,null);return;

  if(a==="edit-task"){
    const cats=getCats()||[];
    const cat=cats.find(c=>c.id===btn.dataset.cat);
    const tk=cat?.tasks.find(t=>t.id===btn.dataset.task);
    mPriority=tk?.priority||4;
    modalTask(btn.dataset.cat,btn.dataset.task,null);return;
  }
  if(a==="save-task"){
    const name=(document.getElementById("mtask_name")||{}).value||"";
    if(!name.trim()){alert("Please enter a task name.");return;}
    if(mFreq.type==="once"){
      const dp=document.getElementById("mtask_datepicker");
      if(dp&&dp.value){
        const parts=dp.value.split("-");
        mFreq.year=parseInt(parts[0]);
        mFreq.month=parseInt(parts[1])-1;
        mFreq.date=parseInt(parts[2]);
      } else {
        // fallback to today if date picker empty (iOS issue)
        const now=new Date();
        mFreq.year=now.getFullYear();
        mFreq.month=now.getMonth();
        mFreq.date=now.getDate();
      }
    } else {
      const fd=document.getElementById("mtask_date");if(fd)mFreq.date=parseInt(fd.value)||new Date().getDate();
      const fm=document.getElementById("mtask_month");if(fm)mFreq.month=parseInt(fm.value);
