function dlCSV(rows,fn){
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download=fn;a.click();
}
function getTasksForDay(wk,day){
  const cats=getCats()||[];
  const di=DAYS.indexOf(day);
  const ch=_checks[wk]||{};
  const{sunday}=parseWk(wk);
  const dayDate=new Date(sunday.getFullYear(),sunday.getMonth(),sunday.getDate()+di);
  const dateStr=dayDate.getFullYear()+"-"+String(dayDate.getMonth()+1).padStart(2,"0")+"-"+String(dayDate.getDate()).padStart(2,"0");
  const rows=[];
  cats.forEach(cat=>{
    if(!catOn(cat,di,wk,day)||cat.isHabits) return;
    catAllTasks(cat,dateStr).forEach(tk=>{
      const chk=!!(ch[day+":"+cat.id+":"+tk.id]);
      const skipped=!!(ch[day+":"+cat.id+":"+tk.id+"__skip"]);
      if(skipped&&!chk) return;
      const applies=tk.freq&&tk.freq.type==="once"
        ?onceTaskMatchesDay(tk,wk,day)
        :fApplies(tk.freq,di);
      if(!applies&&!chk) return;
      if(!taskCreatedBeforeOrOnDay(tk,wk,day)) return;
      const pr=PRIORITIES.find(p=>p.id===(tk.priority||4));
      rows.push([dateStr,day,cat.name,tk.name,pr?pr.label:"",chk?"Yes":"No"]);
    });
  });
  return rows;
}
function exportWeek(){
  const wk=wkKey();
  const{sunday}=parseWk(wk);
  const end=new Date(sunday);end.setDate(sunday.getDate()+6);
  const rows=[["Date","Day","Category","Task","Priority","Completed"]];
  DAYS.forEach((day)=>{
    const sun=sunday;
    getTasksForDay(wk,day).forEach(r=>rows.push(r));
  });
  dlCSV(rows,"life-planner-week-"+wk+".csv");
}
function exportMonth(){
  const rows=[["Date","Day","Category","Task","Priority","Completed"]];
  const daysInMonth=new Date(dashY,dashM+1,0).getDate();
  for(let date=1;date<=daysInMonth;date++){
    const d=new Date(dashY,dashM,date);
    const day=DAYS[d.getDay()];
    const sun=new Date(dashY,dashM,date-d.getDay());
    const wk=sun.getFullYear()+"-"+String(sun.getMonth()+1).padStart(2,"0")+"-"+String(sun.getDate()).padStart(2,"0");
    getTasksForDay(wk,day).forEach(r=>rows.push(r));
  }
  dlCSV(rows,"life-planner-"+MONTHS[dashM]+"-"+dashY+".csv");
}
function exportYear(){
  const rows=[["Date","Day","Category","Task","Priority","Completed"]];
  for(let m=0;m<12;m++){
    const daysInMonth=new Date(dashY,m+1,0).getDate();
    for(let date=1;date<=daysInMonth;date++){
      const d=new Date(dashY,m,date);
      if(d>new Date()) break;
      const day=DAYS[d.getDay()];
      const sun=new Date(dashY,m,date-d.getDay());
      const wk=sun.getFullYear()+"-"+String(sun.getMonth()+1).padStart(2,"0")+"-"+String(sun.getDate()).padStart(2,"0");
      getTasksForDay(wk,day).forEach(r=>rows.push(r));
    }
  }
  dlCSV(rows,"lifeplanner-"+dashY+".csv");
}
function calcCustomRange(startStr,endStr){
  const cats=getCats()||[];
  const start=new Date(startStr);const end=new Date(endStr);
  let done=0,total=0;
  const byCatMap={};
  cats.forEach(c=>{byCatMap[c.id]={name:c.name,icon:c.icon,color:c.color,done:0,total:0};});
  const cur=new Date(start);
  while(cur<=end){
    const day=DAYS[cur.getDay()];
    const sun=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-cur.getDay());
    const wk=sun.getFullYear()+"-"+String(sun.getMonth()+1).padStart(2,"0")+"-"+String(sun.getDate()).padStart(2,"0");
    getTasksForDay(wk,day).forEach(r=>{
      total++;byCatMap[cats.find(c=>c.name===r[2])?.id||""]&&(byCatMap[cats.find(c=>c.name===r[2])?.id||""].total++);
      if(r[5]==="Yes"){done++;byCatMap[cats.find(c=>c.name===r[2])?.id||""]&&(byCatMap[cats.find(c=>c.name===r[2])?.id||""].done++);}
    });
    cur.setDate(cur.getDate()+1);
  }
  const pct=total?Math.round(done/total*100):0;
  const byCat=Object.values(byCatMap).filter(c=>c.total>0);
  return{done,total,pct,byCat};
}
function exportCustom(){
  if(!customStart||!customEnd) return;
  const rows=[["Date","Day","Category","Task","Priority","Completed"]];
  const start=new Date(customStart);const end=new Date(customEnd);
  const cur=new Date(start);
  while(cur<=end){
    const day=DAYS[cur.getDay()];
    const sun=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()-cur.getDay());
    const wk=sun.getFullYear()+"-"+String(sun.getMonth()+1).padStart(2,"0")+"-"+String(sun.getDate()).padStart(2,"0");
    getTasksForDay(wk,day).forEach(r=>rows.push(r));
    cur.setDate(cur.getDate()+1);
  }
  dlCSV(rows,"lifeplanner-"+customStart+"-to-"+customEnd+".csv");
}

function migrateLegacyChecks(){
  const allKeys=Object.keys(localStorage).filter(k=>k.startsWith("checks:"));
  allKeys.forEach(storageKey=>{
    const wk=storageKey.replace("checks:","");
    const data=ls.get(storageKey,{});let changed=false;const newData={};
    Object.keys(data).forEach(k=>{
      if(k.startsWith(wk+":")){newData[k.slice(wk.length+1)]=data[k];changed=true;}
      else{newData[k]=data[k];}
    });
    if(changed) ls.set(storageKey,newData);
  });
}

async function handleImport(e){
  const file=e.target.files[0];if(!file) return;
  const reader=new FileReader();
  reader.onload=async function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      // Support new format (categories) and old localStorage format (planner_cats)
      const cats=data.categories||data.planner_cats||null;
      if(!cats||!Array.isArray(cats)||cats.length===0){
        alert("This backup file doesn't contain valid planner data.");
        return;
      }
      openModal(
        '<div class="mo-title">Restore Backup</div>'
        +'<div style="font-size:14px;color:var(--ink);margin-bottom:8px">Found <strong>'+cats.length+'</strong> categories with all their tasks.</div>'
        +'<div style="font-size:12px;opacity:.5;margin-bottom:24px">This will overwrite your current categories and tasks.</div>'
        +'<button class="mo-save" id="confirm-import">Restore</button>'
        +'<button class="mo-cancel" data-action="close-modal">Cancel</button>'
      );
      document.getElementById("confirm-import").onclick=async function(){
        closeModal();
        await sbSet("categories",cats);
        _cats=cats;
        ls.set("cats_backup",cats);
        alert("Restored "+cats.length+" categories. Reloading...");
        location.reload();
      };
    }catch(err){alert("Could not read file. Make sure it's a valid backup.");}
  };
  reader.readAsText(file);e.target.value="";
}
